# 安卓客户端自己的版本号，和固件、服务器无关。发布：改这里，再打 tag rednote-android-v<versionName>。
# The Android client's own version, independent of the firmware and server. To release: bump here, then tag
# rednote-android-v<versionName>.
versionName=1.3.1
# CI 上实际的 versionCode = 这个数 + GitHub Actions 的运行序号，保证每次发布都能覆盖安装。
# On CI the real versionCode = this + the GitHub Actions run number, so every release installs over the last.
versionCode=1
