锁屏壁纸上传页：图片先在浏览器里按屏幕比例缩成 562×1000 的灰度 JPEG（铺满裁边或完整留白），再逐张 PUT 到 /upload，
设备放进 TF 卡 wallpapers；同名自动加序号，不覆盖。
Lock wallpaper upload page: each image is first turned in the browser into a 562x1000 grayscale JPEG at the screen's
proportions (filled and cropped, or whole with margins), then PUT to /upload one by one into wallpapers on the TF card;
clashing names get a number, never overwriting.
冻结：设备只收处理好的 JPEG，原图不上传；562×1000 是设备解码上限 648×1000 以内的屏幕比例。
Frozen: the device receives only the processed JPEG, never the original; 562x1000 is the screen ratio within the
device's 648x1000 decode limit.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小纸 Pico · 上传壁纸</title>
<style>
  body { margin: 0; background: #faf9f5; color: #222; font: 17px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 20px 40px; }
  h1 { font-size: 24px; margin: 10px 0 2px; }
  .hint { color: #555; font-size: 15px; line-height: 1.5; margin: 4px 0; }
  label.mode { display: inline-flex; align-items: center; gap: 6px; margin: 8px 18px 0 0; }
  button { margin-top: 16px; font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid #222; background: #222; color: #fff; }
  button:disabled { opacity: .5; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 16px; }
  figure { margin: 0; font-size: 13px; color: #555; overflow-wrap: anywhere; }
  figure canvas { width: 100%; height: auto; border: 1px solid #cfccc2; border-radius: 6px; background: #fff; display: block; }
  .ok { color: #1b5e20; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1>小纸 Pico · 上传壁纸</h1>
  <p class="hint">选几张图片，手机会先把它们缩成屏幕大小的灰度图，再传到设备 TF 卡的 wallpapers 文件夹。传完回到设备上点一张设为锁屏壁纸。</p>
  <p class="hint" id="space">正在查询存储空间…</p>
  <input id="files" type="file" accept="image/*" multiple>
  <div>
    <label class="mode"><input type="radio" name="mode" value="fill" checked>铺满（裁掉多出的边）</label>
    <label class="mode"><input type="radio" name="mode" value="fit">完整（四周留白）</label>
  </div>
  <button id="send" disabled>开始上传</button>
  <p id="state" role="status"></p>
  <div id="grid"></div>
</main>
<script>
const W = 562, H = 1000;
const $ = (s) => document.querySelector(s);
let busy = false;
const size = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
fetch('/info', {cache: 'no-store'}).then((r) => r.json()).then((d) => {
  $('#space').textContent = 'TF 卡剩余 ' + size(d.free_bytes) + '。每张处理后大约 100～300 KB。';
}).catch(() => { $('#space').textContent = '读不到设备信息，请确认手机连着设备显示的网络后刷新。'; });
$('#files').onchange = () => { $('#send').disabled = busy || !$('#files').files.length; };

// 设备不收的字符换成下划线，去掉扩展名，最多 60 个字符。/ Replace characters the device rejects, drop the extension,
// keep at most 60 characters.
function baseName(name) {
  let b = name.replace(/\.[^.]*$/, '').replace(/[\/\\:*?"<>|\x00-\x1f\x7f]/g, '_').replace(/\.\.+/g, '.');
  b = b.replace(/^[.\s]+|\s+$/g, '');
  b = Array.from(b).slice(0, 60).join('');
  return b || 'wallpaper';
}

async function load(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch (e) {}
  }
  return await new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => fail(Error('这张图打不开'));
    img.src = URL.createObjectURL(file);
  });
}

// 画到 562×1000 的白底上，再转成灰度。/ Draw onto a white 562x1000 canvas, then turn it gray.
function render(img, mode) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, W, H);
  const iw = img.width, ih = img.height;
  const s = mode === 'fit' ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
  const dw = iw * s, dh = ih * s;
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  const d = g.getImageData(0, 0, W, H), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const y = Math.round(0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]);
    p[i] = p[i + 1] = p[i + 2] = y;
  }
  g.putImageData(d, 0, 0);
  return c;
}

function put(blob, name) {
  return new Promise((ok, fail) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/upload?name=' + encodeURIComponent(name));
    xhr.onload = () => { let body = {}; try { body = JSON.parse(xhr.responseText); } catch (e) {} ok({status: xhr.status, body}); };
    xhr.onerror = () => fail(Error('网络中断，请确认手机还连着设备'));
    xhr.send(blob);
  });
}

// 同名就加 -2、-3…，不覆盖已有的壁纸。/ On a clash add -2, -3…, never overwriting an existing wallpaper.
async function send(blob, base) {
  for (let n = 1; n <= 30; n++) {
    const name = base + (n > 1 ? '-' + n : '') + '.jpg';
    const r = await put(blob, name);
    if (r.status === 409) continue;
    if (r.status !== 200) throw Error(r.body.error || ('设备返回 ' + r.status));
    return name;
  }
  throw Error('同名的图太多了，请改个文件名');
}

$('#send').onclick = async () => {
  const files = Array.from($('#files').files);
  if (!files.length || busy) return;
  busy = true;
  $('#send').disabled = $('#files').disabled = true;
  const mode = document.querySelector('input[name=mode]:checked').value;
  let done = 0;
  for (const [i, file] of files.entries()) {
    $('#state').textContent = '正在处理第 ' + (i + 1) + ' / ' + files.length + ' 张…';
    const fig = document.createElement('figure');
    const note = document.createElement('div');
    try {
      const canvas = render(await load(file), mode);
      fig.append(canvas, note);
      $('#grid').append(fig);
      const blob = await new Promise((ok) => canvas.toBlob(ok, 'image/jpeg', 0.9));
      if (!blob) throw Error('转换失败');
      note.textContent = '上传中…';
      const name = await send(blob, baseName(file.name));
      note.textContent = '✓ ' + name;
      note.className = 'ok';
      done++;
    } catch (e) {
      if (!fig.parentNode) { fig.append(note); $('#grid').append(fig); }
      note.textContent = file.name + '：' + e.message;
      note.className = 'err';
    }
  }
  $('#state').textContent = '传好 ' + done + ' / ' + files.length + ' 张。回到设备上点“完成”，就能在列表里看到。';
  busy = false;
  $('#files').value = '';
  $('#files').disabled = false;
};
</script>
</body>
</html>
