# webtoon：给小纸 Pico 的 WEBTOON 发现与追更服务器。设备问哪一话，服务器才从 webtoons.com 拉公开免费的原图、转成墨水屏
# 用的灰度页面、打包成 CBZ。服务器不保存订阅（订阅在设备的 TF 卡上）。自己部署、只给自己用。
# webtoon: the comic store and update server for the Read Pico. Only when the device asks for an episode does the
# server fetch its free public images from webtoons.com, turn them into e-ink gray pages and pack a CBZ. The server keeps
# no subscriptions (they live on the device's TF card). Self-hosted for personal use.
#
# 用法 / Usage:  docker compose up -d   然后打开 / then open  http://服务器IP:8095
#
# 插件功能（可选，多占约 1 GB 内存）：在 .env 里写 COMPOSE_PROFILES=mihon 再 docker compose up -d，会多起一个
# Suwayomi-Server 运行 Mihon 插件。本项目不提供任何插件仓库，只添加你有权访问的来源。
# Plugin feature (optional, about 1 GB more memory): put COMPOSE_PROFILES=mihon in .env and run docker compose up -d
# to add a Suwayomi-Server that runs Mihon extensions. This project ships no extension repository; only add sources you
# have the right to access.
#
# 有的插件站点要过 Cloudflare 验证（报错带 cloudflare / flaresolverr）：改成 COMPOSE_PROFILES=mihon,flaresolverr，
# 多起一个 FlareSolverr（无头 Chromium，再多占约 500 MB 内存）替插件过验证。
# Some extension sites need a Cloudflare check (errors mention cloudflare / flaresolverr): use
# COMPOSE_PROFILES=mihon,flaresolverr to add FlareSolverr (headless Chromium, about 500 MB more memory) to pass it.
#
# E-Hentai 通道（面板里打开，不用插件）要登录账号时也要 FlareSolverr（登录页要过 Cloudflare 验证）：不开插件就写
# COMPOSE_PROFILES=flaresolverr。不登录不用加。
# The E-Hentai channel (turned on in the panel, no extensions) also needs FlareSolverr to sign in (the sign-in page has
# a Cloudflare check): without extensions use COMPOSE_PROFILES=flaresolverr. Not needed without signing in.
services:
  hub:
    image: ghcr.io/bidabrain/treader-webtoon:latest
    container_name: webtoon-hub
    restart: unless-stopped
    ports:
      - "${WEBTOON_BIND:-0.0.0.0}:${WEBTOON_PORT:-8095}:8095"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/panel/state', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  suwayomi:
    profiles: ["mihon"]
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2373
    container_name: webtoon-suwayomi
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy       # hub 先生成共用的密码文件 / The hub writes the shared password file first
    # 不映射端口：只有 hub 在 compose 内网里访问它。/ No published port: only the hub reaches it inside compose.
    environment:
      AUTH_MODE: basic_auth
      AUTH_USERNAME: hub
      AUTH_PASSWORD_FILE: /hub/suwayomi.secret
      WEB_UI_ENABLED: "false"
      KCEF_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx${MIHON_HEAP:-768m}"
      # 一直指向 flaresolverr：只在站点要过 Cloudflare 验证时才用；没开 flaresolverr 时那几话照样失败，hub 会提示怎么开。
      # Always pointed at flaresolverr: used only when a site needs a Cloudflare check; without the flaresolverr
      # profile those episodes fail as before and the hub says how to turn it on.
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - ./data/mihon:/hub:ro
      - suwayomi:/home/suwayomi/.local/share/Tachidesk
      # 自己的本地漫画（Mihon 本地来源的格式：一部一个文件夹，每话一个子文件夹或 CBZ）：去掉下一行的 # 号。
      # Your own local comics (Mihon local-source layout: a folder per title, a subfolder or CBZ per chapter):
      # uncomment the next line.
      # - ./local:/home/suwayomi/.local/share/Tachidesk/local

  flaresolverr:
    profiles: ["flaresolverr"]
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: webtoon-flaresolverr
    restart: unless-stopped
    # 不映射端口：只有 suwayomi 和 hub（E-Hentai 登录）在 compose 内网里访问它。/ No published port: only suwayomi
    # and the hub (E-Hentai sign-in) reach it inside compose.
    environment:
      LOG_LEVEL: info

volumes:
  suwayomi:
