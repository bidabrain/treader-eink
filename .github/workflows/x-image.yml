# 构建 x 面板镜像并发布到 GitHub Container Registry（ghcr.io/bidabrain/treader-x）。
# Build the x panel image and publish it to GitHub Container Registry (ghcr.io/bidabrain/treader-x).
name: x image

on:
  push:
    branches: [main]
    paths: ["x/hub/**", ".github/workflows/x-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: x/hub
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bidabrain/treader-x:latest
            ghcr.io/bidabrain/treader-x:${{ github.sha }}
