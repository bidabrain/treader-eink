# WEBTOON 漫画安卓客户端：打 tag webtoon-android-v* 时编译 APK 并发布 GitHub Release。
# WEBTOON comics Android client: build the APK and publish a GitHub Release on a webtoon-android-v* tag.
#
# 签名：WEBTOON App 自己的固定 keystore（和其他 App 都不同），这样每次发布都能覆盖安装。keystore 不进仓库，来自 Secret
# WEBTOON_KEYSTORE_BASE64（base64 编码的 ~/.android/webtoon.keystore，别名 webtoon，口令 android）。
# Signing: the WEBTOON app's own fixed keystore (not another app's key) so each release installs over the last. The
# keystore is not in the repo; it comes from the WEBTOON_KEYSTORE_BASE64 secret (base64 of ~/.android/webtoon.keystore,
# alias webtoon, password android).
name: webtoon android

on:
  push:
    tags: ["webtoon-android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtoon/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 还原固定的 WEBTOON keystore；没设 Secret 就直接失败，免得发出签名不一样、装不上的 APK。
      # Restore the fixed WEBTOON keystore; fail without the secret rather than ship an APK with a different signature.
      - name: Restore WEBTOON keystore
        env:
          KEYSTORE_B64: ${{ secrets.WEBTOON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret WEBTOON_KEYSTORE_BASE64 / missing secret WEBTOON_KEYSTORE_BASE64"
            exit 1
          fi
          ks="$RUNNER_TEMP/webtoon.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          # 明确告诉 Gradle 用这个文件签名，并打印指纹方便核对。/ Point Gradle at this file and print its fingerprint.
          echo "WEBTOON_KEYSTORE=$ks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$ks" -storepass android -alias webtoon | grep -E 'SHA256:'

      # 先跑订阅标记、文件命名、检查更新计划的单元测试，不过就不发布。/ Run the unit tests (subscription mark, file
      # naming, update plans) first; no release on failure.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      # 核对 APK 真是用这把钥匙签的，不对就失败，不发布。/ Check the APK is signed with that key; fail otherwise.
      - name: Verify signature
        run: |
          want=$(keytool -list -v -keystore "$WEBTOON_KEYSTORE" -storepass android -alias webtoon \
                 | grep -E 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                | grep 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "keystore $want"
          echo "apk      $got"
          if [ "$want" != "$got" ]; then echo "::error::APK 签名和 Secret 里的 keystore 不一致 / APK signer does not match the keystore"; exit 1; fi

      - name: Name the APK
        id: apk
        run: |
          ver=$(grep '^versionName=' version.properties | cut -d= -f2)
          out="webtoon-android-${ver}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=webtoon/android/$out" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: webtoon-android-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/webtoon-android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: WEBTOON 漫画安卓客户端 ${{ steps.apk.outputs.version }}
          body: |
            WEBTOON 漫画独立安卓客户端，功能和小纸 Pico 固件里的发现漫画一样：逛发现页、订阅、检查更新下载新话、一屏一页看漫画，
            读你自己部署的 webtoon 服务器（见 webtoon/README.md）。
            只拉公开免费的话，只给自己离线阅读：请不要把服务器开放给别人，也不要分享下载的漫画。
            每次发布用同一个签名，可以直接覆盖安装。
          files: ${{ steps.apk.outputs.file }}
          make_latest: false
