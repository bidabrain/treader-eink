# 构建 webtoon 面板镜像并发布到 GitHub Container Registry（ghcr.io/bidabrain/treader-webtoon）。
# Build the webtoon panel image and publish it to GitHub Container Registry (ghcr.io/bidabrain/treader-webtoon).
name: webtoon image

on:
  push:
    branches: [main]
    paths: ["webtoon/hub/**", ".github/workflows/webtoon-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: webtoon/hub
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bidabrain/treader-webtoon:latest
            ghcr.io/bidabrain/treader-webtoon:${{ github.sha }}
