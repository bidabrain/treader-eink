# 把 site/（项目主页和网页刷机工具）发布到 GitHub Pages，界面截图从 docs/images 复制进去。只发布网页，不编译、不上传任何固件。
# Publish site/ (the project homepage and web flasher) to GitHub Pages, copying the screenshots in from docs/images.
# Publishes the page only; no firmware is built or uploaded.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 上传和部署分成两个 job（官方模板的写法）：同一个 job 里传完立刻部署，deploy-pages 有时列不出刚传的包，
# 报 No artifacts named "github-pages"。/ Upload and deploy are separate jobs, as in the official template: deploying
# right after the upload in the same job sometimes fails to list the fresh artifact.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      # 截图只在 docs/images 存一份，发布时复制；英文页的截图在 docs/images/en。/ Screenshots live only in docs/images
      # and are copied at publish time; the English page's are in docs/images/en.
      - name: Copy screenshots
        run: mkdir -p site/img/en && cp docs/images/*.png site/img/ && cp docs/images/en/*.png site/img/en/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
