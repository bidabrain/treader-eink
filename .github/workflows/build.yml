# 编译 Treader 固件：用真机的产品配置（sdkconfig.defaults，和设备上一样的 flash / PSRAM 时序），可以直接刷进小纸 Pico；
# 不带内置番茄服务器，书城默认用 FanqieRankTracker。main 上固件有改动就自动发布：
#   - “最新构建”（tag treader-latest）每次替换成这次的固件；
#   - 版本号（CMakeLists.txt 的 PROJECT_VER）第一次出现时，另外发布一个固定的 treader-v<版本号>。
# Build the Treader firmware with the product configuration (sdkconfig.defaults, the device's flash / PSRAM timing),
# ready to flash on a Read Pico; no built-in Tomato server, FanqieRankTracker as the default bookstore. Every firmware
# change on main publishes automatically: the rolling "latest build" (tag treader-latest) is replaced each time, and a
# permanent treader-v<version> release is added the first time a PROJECT_VER appears.
name: build

on:
  push:
    branches: [main]
    # 只改文档、网页、服务器或安卓 App 时不用编固件。/ Skip the firmware build for docs, site, servers and apps.
    paths-ignore: ["**.md", "docs/**", "site/**", "rednote/**", "weibo/**", "tomato/**", ".github/workflows/pages.yml", ".github/workflows/rednote-image.yml", ".github/workflows/weibo-image.yml", ".github/workflows/tomato-image.yml", ".github/workflows/rednote-android.yml", ".github/workflows/weibo-android.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 钉在 v6.1 发布点。release-v6.1 分支会继续演进，LCD LL 接口已经变过一次。
    # Pin to the v6.1 release. The release-v6.1 branch keeps moving; the LCD LL API already changed once.
    container: espressif/idf:v6.1
    env:
      # 公开的默认书城；番茄服务器的地址和密码一律不给，固件里就没有内置服务器。
      # The public default bookstore; no Tomato server address or password is given, so none is built in.
      STORE_URL: https://bidabrain.github.io/FanqieRankTracker
      DOWNLOADER_URL: ""
      DOWNLOADER_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # local.properties 不入库，这里也绝不能有。/ local.properties is never committed and must not exist here.
          test ! -e local.properties
          idf.py set-target esp32s3 2>&1 | tee configure.log
          # 构建脚本会说明有没有内置番茄服务器；有就失败。/ The build script reports the built-in Tomato server; fail if any.
          grep -q "Treader: no built-in Tomato server" configure.log
          idf.py build

      - name: size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size

      # 合并成一个完整镜像，给网页刷机“完整安装”用；Read_Pico.bin 用来升级。
      # Merge one full image for the web flasher's full install; Read_Pico.bin is for upgrades.
      - name: package
        id: pkg
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          ver=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)
          cd build
          python -m esptool --chip esp32s3 merge-bin -o treader-full.bin --flash-mode dio --flash-freq 80m \
            --flash-size 16MB 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin \
            0x10000 Read_Pico.bin
          mkdir -p ../out
          cp treader-full.bin "../out/treader-${ver}-full.bin"
          cp Read_Pico.bin "../out/treader-${ver}-upgrade.bin"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: treader-firmware-${{ steps.pkg.outputs.version }}
          path: out/*.bin
          if-no-files-found: error

      # 发布只在 main 上做（PR 只编译、上传构建产物）。/ Publish only on main (pull requests just build and upload).
      - name: Prepare releases
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.pkg.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          head = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers=head)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, (json.load(r) if r.length else None)
              except urllib.error.HTTPError as e:
                  return e.code, None
          # 旧的“最新构建”连同 tag 一起删掉，下一步按这次的提交重建。/ Drop the old rolling release and its tag;
          # the next step recreates them at this commit.
          code, rel = call("GET", f"{api}/releases/tags/treader-latest")
          if code == 200:
              call("DELETE", f"{api}/releases/{rel['id']}")
          call("DELETE", f"{api}/git/refs/tags/treader-latest")
          code, _ = call("GET", f"{api}/releases/tags/treader-v{os.environ['VER']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"new_version={'true' if code == 404 else 'false'}", file=out)
          PY

      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: treader-latest
          target_commitish: ${{ github.sha }}
          name: Treader ${{ steps.pkg.outputs.version }} · 最新构建
          body: |
            main 上最新的 Treader 固件（${{ steps.pkg.outputs.version }}，提交 ${{ github.sha }}），固件一有改动就自动替换。用真机的产品配置编译，可以直接刷进小纸 Pico。
            不带内置番茄服务器：要用番茄小说，在设备“设置 › 内容来源 › 番茄小说”填你自己的下载服务器。书城默认用 FanqieRankTracker 榜单。

            - `treader-${{ steps.pkg.outputs.version }}-full.bin`：完整镜像。第一次刷 Treader、或者分区表有变化时，用网页刷机的“完整安装”。
            - `treader-${{ steps.pkg.outputs.version }}-upgrade.bin`：只有主程序。网页刷机选“升级”，或者放进 TF 卡 `update/` 在设备上升级。

            网页刷机：https://bidabrain.github.io/treader-eink/ 。改了什么见 docs/CHANGELOG.md。
          files: out/*.bin
          make_latest: true

      - name: Publish version
        if: steps.rel.outputs.new_version == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: treader-v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Treader ${{ steps.pkg.outputs.version }}
          body: |
            Treader ${{ steps.pkg.outputs.version }} 第一次构建。之后同一版本号上的修改只更新“最新构建”（treader-latest）。
            不带内置番茄服务器；书城默认用 FanqieRankTracker 榜单。刷机见 https://bidabrain.github.io/treader-eink/ 。
          files: out/*.bin
          make_latest: false
