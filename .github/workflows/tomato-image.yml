# 构建 tomato（番茄下载器）面板镜像并发布到 GitHub Container Registry（ghcr.io/bidabrain/treader-tomato）。
# Build the tomato (Tomato downloader) panel image and publish it to GitHub Container Registry (ghcr.io/bidabrain/treader-tomato).
name: tomato image

on:
  push:
    branches: [main]
    paths: ["tomato/hub/**", ".github/workflows/tomato-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tomato/hub
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bidabrain/treader-tomato:latest
            ghcr.io/bidabrain/treader-tomato:${{ github.sha }}
