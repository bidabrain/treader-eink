# 小红书安卓客户端：打 tag rednote-android-v* 时编译 APK 并发布 GitHub Release。
# Xiaohongshu Android client: build the APK and publish a GitHub Release on a rednote-android-v* tag.
#
# 签名：发布版也用固定的 debug keystore，这样每次发布都能覆盖安装。keystore 不进仓库，来自 Secret
# DEBUG_KEYSTORE_BASE64（base64 编码的 ~/.android/debug.keystore，别名 androiddebugkey，口令 android）。
# Signing: releases use a fixed debug keystore so each one installs over the last. The keystore is not in the repo; it
# comes from the DEBUG_KEYSTORE_BASE64 secret (base64 of ~/.android/debug.keystore, alias androiddebugkey,
# password android).
name: rednote android

on:
  push:
    tags: ["rednote-android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rednote/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 还原固定的 debug keystore；没设 Secret 就直接失败，免得发出签名不一样、装不上的 APK。
      # Restore the fixed debug keystore; fail without the secret rather than ship an APK with a different signature.
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret DEBUG_KEYSTORE_BASE64 / missing secret DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Name the APK
        id: apk
        run: |
          ver=$(grep '^versionName=' version.properties | cut -d= -f2)
          out="rednote-android-${ver}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=rednote/android/$out" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rednote-android-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/rednote-android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 小红书安卓客户端 ${{ steps.apk.outputs.version }}
          body: |
            小红书独立安卓客户端，功能和 Treader 固件里的小红书标签一样，读你自己部署的 rednote 服务器（见 rednote/README.md）。
            每次发布用同一个签名，可以直接覆盖安装。
          files: ${{ steps.apk.outputs.file }}
          make_latest: false
