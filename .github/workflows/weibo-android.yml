# 微博安卓客户端：打 tag weibo-android-v* 时编译 APK 并发布 GitHub Release。
# Weibo Android client: build the APK and publish a GitHub Release on a weibo-android-v* tag.
#
# 签名：微博 App 自己的固定 keystore（和小红书 App 不同），这样每次发布都能覆盖安装。keystore 不进仓库，来自 Secret
# WEIBO_KEYSTORE_BASE64（base64 编码的 ~/.android/weibo.keystore，别名 weibo，口令 android）。
# Signing: the Weibo app's own fixed keystore (not the Xiaohongshu app's) so each release installs over the last. The
# keystore is not in the repo; it comes from the WEIBO_KEYSTORE_BASE64 secret (base64 of ~/.android/weibo.keystore,
# alias weibo, password android).
name: weibo android

on:
  push:
    tags: ["weibo-android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weibo/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 还原固定的微博 keystore；没设 Secret 就直接失败，免得发出签名不一样、装不上的 APK。
      # Restore the fixed Weibo keystore; fail without the secret rather than ship an APK with a different signature.
      - name: Restore Weibo keystore
        env:
          KEYSTORE_B64: ${{ secrets.WEIBO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret WEIBO_KEYSTORE_BASE64 / missing secret WEIBO_KEYSTORE_BASE64"
            exit 1
          fi
          ks="$RUNNER_TEMP/weibo.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          # 明确告诉 Gradle 用这个文件签名，并打印指纹方便核对。/ Point Gradle at this file and print its fingerprint.
          echo "WEIBO_KEYSTORE=$ks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$ks" -storepass android -alias weibo | grep -E 'SHA256:'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      # 核对 APK 真是用这把钥匙签的，不对就失败，不发布。/ Check the APK is signed with that key; fail otherwise.
      - name: Verify signature
        run: |
          want=$(keytool -list -v -keystore "$WEIBO_KEYSTORE" -storepass android -alias weibo \
                 | grep -E 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                | grep 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "keystore $want"
          echo "apk      $got"
          if [ "$want" != "$got" ]; then echo "::error::APK 签名和 Secret 里的 keystore 不一致 / APK signer does not match the keystore"; exit 1; fi

      - name: Name the APK
        id: apk
        run: |
          ver=$(grep '^versionName=' version.properties | cut -d= -f2)
          out="weibo-android-${ver}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=weibo/android/$out" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: weibo-android-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/weibo-android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 微博安卓客户端 ${{ steps.apk.outputs.version }}
          body: |
            微博独立安卓客户端，功能和 Treader 固件里的微博标签一样，读你自己部署的 weibo 服务器（见 weibo/README.md）。
            每次发布用同一个签名，可以直接覆盖安装。
          files: ${{ steps.apk.outputs.file }}
          make_latest: false
